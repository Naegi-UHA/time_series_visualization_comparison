{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export comparison data</title>
    <link rel="stylesheet" href="{% static 'core/css/exportation.css' %}?v=20261105-exportation-menu">
</head>
<body class="export-page">
    <main class="panel export-panel">
        <h1>Export comparison data</h1>
        <p>Export the Dataset Map coordinates and pairwise distances.</p>

        <label class="export-filename-control" for="export-filename">
            File name
            <input
                id="export-filename"
                name="filename"
                type="text"
                value="dataset-comparison"
                maxlength="120"
                autocomplete="off"
                required
            >
            <span>The selected format extension will be added automatically.</span>
        </label>

        <div class="export-format-control">
            <details class="graph-selector export-format-selector">
                <summary>Select format</summary>
                <div class="graph-options export-format-options">
                    <button type="button" data-format="csv">.csv</button>
                    <button type="button" data-format="ods">.ods</button>
                    <button type="button" data-format="pdf-graph">.pdf : only graph</button>
                </div>
            </details>
            <p id="current-export-format">Current format: .csv</p>
        </div>

        <button
            id="export-download-button"
            class="compare-button"
            type="button"
            data-url="{% url 'export-ods' %}"
            data-pdf-url="{% url 'export-pdf-graph' %}"
            disabled
        >
            Export
        </button>
        <p id="export-status" class="comparison-status" role="status" aria-live="polite">
            Waiting for comparison data...
        </p>
    </main>

    <form id="csrf-token-form" hidden>{% csrf_token %}</form>
    <script src="{% static 'core/js/exportation/csv.js' %}?v=20261105-export" defer></script>
    <script src="{% static 'core/js/exportation/pdf_graph.js' %}?v=20261105-pdf-graph" defer></script>
    <script src="{% static 'core/js/exportation/exportation.js' %}?v=20261105-pdf-graph" defer></script>
</body>
</html>
